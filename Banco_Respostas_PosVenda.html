<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Respostas – Pós-Venda</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-dark:  #1F4E79;
    --blue-mid:   #2E75B6;
    --blue-light: #D6EAF8;
    --green:      #2E7D32;
    --green-bg:   #E8F5E9;
    --gray-bg:    #F4F6F9;
    --border:     #DEE2E8;
    --text:       #1A1A2E;
    --text-soft:  #555;
    --shadow:     0 2px 8px rgba(0,0,0,.10);
    --shadow-lg:  0 6px 24px rgba(0,0,0,.14);
    --radius:     10px;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    color: #fff;
    padding: 22px 32px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .3px; }
  header p  { font-size: .85rem; opacity: .85; margin-top: 3px; }

  /* ── Controls bar ─────────────────────────────────────── */
  .controls {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    padding: 18px 32px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 74px; z-index: 99;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
  }
  .controls input, .controls select {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: .93rem;
    outline: none;
    transition: border-color .2s;
    color: var(--text);
    background: #fff;
  }
  .controls input { flex: 1; min-width: 220px; }
  .controls input:focus, .controls select:focus { border-color: var(--blue-mid); }
  .search-wrap { flex: 1; position: relative; min-width: 220px; }
  .search-wrap input { width: 100%; padding-left: 38px; }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    opacity: .45; pointer-events: none; font-size: 1rem;
  }
  .counter {
    font-size: .82rem; color: var(--text-soft);
    white-space: nowrap; margin-left: 4px;
  }

  /* ── Grid ─────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
    padding: 24px 32px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ── Card ─────────────────────────────────────────────── */
  .card {
    background: #fff;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--blue-mid);
  }
  .card.copied {
    border-color: var(--green) !important;
    box-shadow: 0 0 0 3px rgba(46,125,50,.18);
    animation: flashGreen .5s ease;
  }
  @keyframes flashGreen {
    0%   { background: #C8E6C9; }
    100% { background: #fff; }
  }

  .card-header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .cat-dot {
    width: 10px; height: 10px;
    border-radius: 50%; flex-shrink: 0; margin-top: 4px;
  }
  .card-title {
    font-weight: 700; font-size: .97rem;
    color: var(--blue-dark); line-height: 1.35;
    flex: 1;
  }
  .copy-hint {
    font-size: .72rem; color: var(--blue-mid); opacity: .7;
    flex-shrink: 0; margin-top: 2px;
  }

  .card-meta {
    padding: 8px 16px;
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--gray-bg);
    border-bottom: 1px solid var(--border);
  }
  .badge {
    font-size: .73rem; padding: 2px 9px;
    border-radius: 999px; font-weight: 600;
    background: var(--blue-light); color: var(--blue-dark);
  }
  .badge.orgao { background: #EDE7F6; color: #4527A0; }

  .card-tags {
    padding: 6px 16px 7px;
    font-size: .75rem; color: var(--text-soft);
    background: var(--gray-bg);
    border-bottom: 1px solid var(--border);
  }

  .card-body {
    padding: 12px 16px 14px;
    font-size: .88rem; line-height: 1.65;
    color: #333;
    flex: 1;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
  }
  .card.expanded .card-body {
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  .card-footer {
    padding: 8px 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border);
    background: var(--gray-bg);
  }
  .card-footer span {
    font-size: .75rem; color: var(--text-soft);
  }
  .btn-copy {
    font-size: .78rem; font-weight: 700;
    background: var(--blue-dark); color: #fff;
    border: none; border-radius: 6px;
    padding: 5px 13px; cursor: pointer;
    transition: background .15s;
  }
  .btn-copy:hover  { background: var(--blue-mid); }
  .btn-copy.done   { background: var(--green); }
  .btn-expand {
    font-size: .75rem; color: var(--blue-mid);
    background: none; border: none; cursor: pointer;
    padding: 0; text-decoration: underline;
  }

  /* ── Toast ────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #1b5e20; color: #fff;
    padding: 11px 26px; border-radius: 8px;
    font-size: .9rem; font-weight: 600;
    box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 9999;
  }
  #toast.show { opacity: 1; }

  /* ── Empty state ──────────────────────────────────────── */
  .empty {
    grid-column: 1/-1;
    text-align: center; padding: 60px 20px;
    color: var(--text-soft);
  }
  .empty span { font-size: 3rem; display: block; margin-bottom: 12px; }

  @media (max-width: 600px) {
    .grid { padding: 16px; gap: 12px; grid-template-columns: 1fr; }
    .controls { padding: 12px 16px; }
    header { padding: 16px; }
  }
</style>
</head>

function getColor(cat) {
  return CAT_COLORS[cat] || { bg: "#F5F5F5", dot: "#9E9E9E" };
}

// ── Inicializar filtros ───────────────────────────────────────────────────
function initFilters() {
  const cats   = [...new Set(RESPOSTAS.map(r => r.categoria))].sort();
  const orgaos = [...new Set(RESPOSTAS.map(r => r.orgao))].sort();
  const selCat   = document.getElementById('filterCat');
  const selOrgao = document.getElementById('filterOrgao');
  cats.forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c;
    selCat.appendChild(o);
  });
  orgaos.forEach(o => {
    const el = document.createElement('option'); el.value = o; el.textContent = o;
    selOrgao.appendChild(el);
  });
}

// ── Copiar para clipboard ─────────────────────────────────────────────────
function copyText(text, cardEl, btnEl) {
  navigator.clipboard.writeText(text).then(() => {
    cardEl.classList.add('copied');
    btnEl.textContent = '✅ Copiado!';
    btnEl.classList.add('done');
    showToast();
    setTimeout(() => {
      cardEl.classList.remove('copied');
      btnEl.textContent = '📋 Copiar';
      btnEl.classList.remove('done');
    }, 2000);
  }).catch(() => {
    // Fallback para navegadores mais antigos
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cardEl.classList.add('copied');
    btnEl.textContent = '✅ Copiado!';
    btnEl.classList.add('done');
    showToast();
    setTimeout(() => {
      cardEl.classList.remove('copied');
      btnEl.textContent = '📋 Copiar';
      btnEl.classList.remove('done');
    }, 2000);
  });
}

let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

    </div>
    <div class="card-tags">🏷 ${r.tags}</div>
    <div class="card-body">${r.texto.replace(/\n/g, '<br>')}</div>
    <div class="card-footer">
      <button class="btn-expand" onclick="event.stopPropagation(); this.closest('.card').classList.toggle('expanded'); this.textContent = this.closest('.card').classList.contains('expanded') ? '▲ Recolher' : '▼ Ver texto completo'">▼ Ver texto completo</button>
      <button class="btn-copy" onclick="event.stopPropagation(); copyText(RESPOSTAS[${r.id-1}].texto, this.closest('.card'), this)">📋 Copiar</button>
    </div>
  `;

  // Clique no card inteiro também copia
  card.addEventListener('click', function(e) {
    if (e.target.tagName === 'BUTTON') return;
    const btn = card.querySelector('.btn-copy');
    copyText(r.texto, card, btn);
  });

  return card;
}

// ── Render principal ──────────────────────────────────────────────────────
function render() {
  const q      = document.getElementById('search').value.toLowerCase();
  const cat    = document.getElementById('filterCat').value;
  const orgao  = document.getElementById('filterOrgao').value;
  const grid   = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = RESPOSTAS.filter(r => {
    const matchCat   = !cat   || r.categoria === cat;
    const matchOrgao = !orgao || r.orgao     === orgao;
    const matchQ     = !q    || [r.titulo, r.categoria, r.orgao, r.tags, r.texto]
                                  .some(v => v.toLowerCase().includes(q));
    return matchCat && matchOrgao && matchQ;
  });

  document.getElementById('counter').textContent =
    `${filtered.length} resposta${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty"><span>🔍</span>Nenhuma resposta encontrada</div>';
    return;
  }

  filtered.forEach(r => grid.appendChild(createCard(r)));
}

// ── Init ──────────────────────────────────────────────────────────────────
initFilters();
render();
</script>
</body>
</html>
